# Turns bug reports sent from the app into GitHub issues (see scripts/bug-reports.mjs).
name: Bug reports to issues

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the issues, create nothing and delete nothing'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: bug-reports

jobs:
  issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin@13
      - run: node scripts/bug-reports.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
